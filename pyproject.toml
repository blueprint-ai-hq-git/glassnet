[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "glassnet"
version = "0.5.0"
description = "GlassNet — a fully transparent, from-scratch neural network system. Readable architecture, auto-pilot trainer, data judge, explain()."
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy", "matplotlib"]

[tool.setuptools]
packages = ["glassnet"]